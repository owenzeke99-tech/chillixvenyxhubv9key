
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chilli X Venyx Hub V9</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #ff2545;
    --silver: #bfc1cb;
    --black: #080809;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 20px;
    background: var(--black);
    color: white;
    font-family: 'Exo 2', sans-serif;
}

/* BACKGROUND */

.bg {
    position: fixed;
    inset: 0;
    z-index: -5;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,0,40,.17),transparent 40%),
        radial-gradient(circle at 80% 80%,rgba(180,180,200,.12),transparent 40%),
        #080809;
}

.grid {
    position: fixed;
    inset: 0;
    z-index: -4;
    background-image:
        linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 15s linear infinite;
}

@keyframes gridMove {
    to { background-position: 40px 40px; }
}

.glow {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .2;
    z-index: -3;
    animation: floatGlow 8s ease-in-out infinite alternate;
}

.glow.red {
    background: #ff173b;
    top: -160px;
    left: -130px;
}

.glow.gray {
    background: #aaa;
    bottom: -180px;
    right: -130px;
    animation-delay: -4s;
}

@keyframes floatGlow {
    to { transform: translate(120px,90px) scale(1.3); }
}

/* MOVING PARTICLES */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -2;
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ff526a;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff2545;
    animation: particleMove linear infinite;
}

@keyframes particleMove {
    0% {
        transform: translateY(110vh) scale(.3);
        opacity: 0;
    }
    20% { opacity: 1; }
    80% { opacity: .8; }
    100% {
        transform: translateY(-15vh) scale(1.5);
        opacity: 0;
    }
}

/* MAIN CONTAINER */

.container {
    width: 100%;
    max-width: 460px;
    padding: 38px 28px 27px;
    border-radius: 25px;
    background: rgba(15,15,18,.93);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 20px 80px rgba(0,0,0,.7);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(25px);
    animation: entrance .9s cubic-bezier(.16,1,.3,1);
}

@keyframes entrance {
    from { opacity: 0; transform: translateY(40px) scale(.94); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.container::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(
        120deg,transparent,#ff2545,#bfc1cb,
        transparent,#ff2545
    );
    background-size: 300% 300%;
    animation: borderMove 5s linear infinite;
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}

@keyframes borderMove {
    to { background-position: 300% 0; }
}

/* HEADER */

.top-tag {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 14px;
    border-radius: 30px;
    border: 1px solid rgba(255,50,70,.35);
    background: rgba(255,30,50,.08);
    color: #ff7183;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 22px;
    animation: tagGlow 2s infinite alternate;
}

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff304b;
    box-shadow: 0 0 15px #ff304b;
    animation: blink 1s infinite alternate;
}

@keyframes blink {
    to { opacity: .2; transform: scale(.7); }
}

@keyframes tagGlow {
    to { box-shadow: 0 0 18px rgba(255,40,60,.2); }
}

.title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px,6vw,29px);
    font-weight: 900;
    line-height: 1.5;
    letter-spacing: 1px;
    background: linear-gradient(90deg,#fff,#ff304c,#aaa,#fff);
    background-size: 250% auto;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    animation: titleShine 5s linear infinite;
}

@keyframes titleShine {
    to { background-position: 250% center; }
}

.subtitle {
    margin-top: 9px;
    color: #888890;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
}

.title-line {
    width: 80px;
    height: 3px;
    margin: 22px auto;
    border-radius: 20px;
    background: linear-gradient(90deg,transparent,#ff2948,#ccc,transparent);
    box-shadow: 0 0 18px #ff2948;
    animation: lineExpand 3s ease-in-out infinite alternate;
}

@keyframes lineExpand {
    to { width: 150px; opacity: .6; }
}

/* KEY MENU */

.key-panel {
    position: relative;
    padding: 21px 18px;
    margin-top: 25px;
    border-radius: 19px;
    background: linear-gradient(145deg,#202025,#0a0a0c);
    border: 1px solid rgba(255,255,255,.12);
    overflow: hidden;
    isolation: isolate;
    transform-style: preserve-3d;
    transition: transform .4s, box-shadow .4s, border-color .4s;
    box-shadow:
        inset 0 0 30px rgba(255,255,255,.025),
        0 10px 35px rgba(0,0,0,.4);
    animation: panelFloat 5s ease-in-out infinite;
}

@keyframes panelFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

.key-panel:hover {
    border-color: #ff304d;
    box-shadow: 0 0 35px rgba(255,30,60,.17);
}

/* Moving light inside panel */

.key-panel::before {
    content: "";
    position: absolute;
    inset: -100%;
    z-index: -1;
    background: conic-gradient(
        transparent 0deg,
        rgba(255,35,65,.3) 45deg,
        transparent 90deg,
        transparent 180deg,
        rgba(180,180,200,.2) 225deg,
        transparent 270deg
    );
    animation: panelRotate 8s linear infinite;
}

@keyframes panelRotate {
    to { transform: rotate(360deg); }
}

.key-panel::after {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 65%;
    height: 100%;
    background: linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
    transform: skewX(-20deg);
    animation: panelScan 4s ease-in-out infinite;
    pointer-events: none;
}

@keyframes panelScan {
    60%,100% { left: 150%; }
}

.key-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
}

.key-heading span:first-child {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #dddde3;
}

.key-badge {
    padding: 6px 11px;
    border-radius: 7px;
    color: #ff6479;
    background: rgba(255,30,50,.12);
    border: 1px solid rgba(255,40,60,.4);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    animation: badgePulse 2s infinite alternate;
}

@keyframes badgePulse {
    to { box-shadow: 0 0 15px rgba(255,40,60,.35); }
}

/* KEY INPUT */

.key-wrap {
    position: relative;
}

.key-box {
    width: 100%;
    height: 55px;
    border-radius: 11px;
    border: 1px solid #55555e;
    background: #080809;
    color: #fff;
    font-family: 'Exo 2', sans-serif;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    padding: 0 10px;
    outline: none;
    transition: .35s;
    box-shadow: inset 0 0 20px rgba(255,255,255,.025);
}

.key-box:focus {
    border-color: #ff2948;
    box-shadow:
        0 0 20px rgba(255,30,50,.2),
        inset 0 0 15px rgba(255,30,50,.08);
}

.key-wrap::after {
    content: "";
    position: absolute;
    height: 2px;
    width: 0;
    bottom: 0;
    left: 50%;
    background: #ff304b;
    box-shadow: 0 0 12px #ff304b;
    transition: .4s;
}

.key-wrap:focus-within::after {
    width: 100%;
    left: 0;
}

/* BUTTON */

.copy-btn {
    width: 100%;
    height: 57px;
    margin-top: 17px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 11px;
    background: linear-gradient(100deg,#800018,#d81737,#ff3854,#9a001d);
    background-size: 300% 100%;
    color: white;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    animation: buttonFlow 5s linear infinite, buttonPulse 3s infinite;
    transition: .3s;
}

@keyframes buttonFlow {
    to { background-position: 300% 0; }
}

@keyframes buttonPulse {
    50% { box-shadow: 0 0 20px rgba(255,30,50,.3); }
}

.copy-btn::before {
    content: "";
    position: absolute;
    top: -100%;
    left: -60%;
    width: 40%;
    height: 300%;
    transform: rotate(25deg);
    background: rgba(255,255,255,.23);
    animation: buttonShine 3s ease-in-out infinite;
}

@keyframes buttonShine {
    60%,100% { left: 140%; }
}

.copy-btn:hover {
    transform: translateY(-4px) scale(1.015);
    filter: brightness(1.2);
    box-shadow: 0 10px 35px rgba(255,30,50,.4);
}

.copy-btn:active {
    transform: scale(.95);
}

/* BUTTON RIPPLE */

.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.4);
    transform: scale(0);
    animation: ripple .7s ease-out forwards;
    pointer-events: none;
}

@keyframes ripple {
    to { transform: scale(5); opacity: 0; }
}

.status {
    min-height: 23px;
    margin-top: 13px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #ff5269;
}

/* FOOTER */

.bottom-info {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
    padding-top: 19px;
    border-top: 1px solid #303036;
    color: #92929b;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
}

.bottom-info span {
    color: #ff536b;
}

.footer {
    text-align: center;
    margin-top: 18px;
    color: #62626a;
    font-size: 10px;
    letter-spacing: 2px;
}

@media(max-width:400px) {
    .container { padding: 30px 19px 24px; }
    .key-panel { padding: 16px 13px; }
    .key-box { font-size: 10px; }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="grid"></div>
<div class="glow red"></div>
<div class="glow gray"></div>
<div class="particles" id="particles"></div>

<main class="container">

    <div class="top-tag">
        <span class="dot"></span>
        OFFICIAL KEY SYSTEM
    </div>

    <h1 class="title">CHILLI X VENYX</h1>
    <h1 class="title">HUB V9</h1>

    <p class="subtitle">PREMIUM ACCESS SYSTEM</p>

    <div class="title-line"></div>

    <section class="key-panel">

        <div class="key-heading">
            <span>YOUR ACCESS KEY</span>
            <span class="key-badge">V9 KEY</span>
        </div>

        <div class="key-wrap">
            <input
                class="key-box"
                id="key"
                type="text"
                readonly
                value="ChilliXVenyxHubV9KeyoosjwowoLapwijwbsoLsowuwj"
            >
        </div>

        <button class="copy-btn" id="copyBtn">
            COPY KEY
        </button>

        <div class="status" id="status"></div>

    </section>

    <div class="bottom-info">
        <div>SYSTEM <span>ONLINE</span></div>
        <div>VERSION <span>V9.0</span></div>
    </div>

    <div class="footer">
        POWERED BY CHILLI X VENYX HUB
    </div>

</main>

<script>
// Create floating particles
const particleArea = document.getElementById("particles");

for (let i = 0; i < 35; i++) {
    const p = document.createElement("span");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = (6 + Math.random() * 12) + "s";
    p.style.animationDelay = (-Math.random() * 15) + "s";
    p.style.opacity = Math.random();
    particleArea.appendChild(p);
}

// Copy key
const button = document.getElementById("copyBtn");

button.addEventListener("click", async (event) => {
    const input = document.getElementById("key");
    const status = document.getElementById("status");

    // Ripple animation
    const rect = button.getBoundingClientRect();
    const ripple = document.createElement("span");
    ripple.className = "ripple";
    ripple.style.width = ripple.style.height = "40px";
    ripple.style.left = (event.clientX - rect.left - 20) + "px";
    ripple.style.top = (event.clientY - rect.top - 20) + "px";
    button.appendChild(ripple);
    setTimeout(() => ripple.remove(), 800);

    let success = false;

    try {
        await navigator.clipboard.writeText(input.value);
        success = true;
    } catch (error) {
        input.select();
        input.setSelectionRange(0, 99999);
        success = document.execCommand("copy");
    }

    if (success) {
        button.textContent = "✓ KEY COPIED";
        status.textContent = "SUCCESSFULLY COPIED!";
    } else {
        button.textContent = "COPY KEY";
        status.textContent = "PLEASE COPY THE KEY MANUALLY!";
    }

    setTimeout(() => {
        button.textContent = "COPY KEY";
        status.textContent = "";
    }, 2500);
});
</script>

</body>
</html>
